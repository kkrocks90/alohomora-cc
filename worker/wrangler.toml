name = "cocoa-kind-checkout"
main = "index.js"
compatibility_date = "2025-08-01"

[vars]
ALLOWED_ORIGIN = "https://kkrocks90.github.io"
STORE_LATITUDE = "REPLACE_WITH_STORE_LATITUDE"
STORE_LONGITUDE = "REPLACE_WITH_STORE_LONGITUDE"
LOGIN_FROM_EMAIL = "Cocoa & Kind <orders@example.com>"

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "cocoa-kind-orders"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
